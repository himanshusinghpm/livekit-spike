<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>LiveKit Settings</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 30px; background: #0a0a0a; color: #f8fafc; max-width: 400px; }
        h2 { color: #f97316; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        label { display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 15px;}
        input { width: 100%; padding: 10px; font-size: 14px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #334155; background: #111; color: white; box-sizing: border-box; font-family: monospace; }
        button { width: 100%; padding: 12px; font-size: 16px; background: #f97316; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 20px;}
        button:hover { background: #ea580c; }
        #status { margin-top: 15px; color: #f97316; font-size: 14px; text-align: center; height: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>LiveKit Worker Config</h2>
    
    <label for="kickInput">Kick Channel</label>
    <input type="text" id="kickInput" placeholder="e.g. deenthegreat">
    
    <label for="ytInput">YouTube Channel Handle</label>
    <input type="text" id="ytInput" placeholder="e.g. @deenthegreat">
    
    <label for="syncCodeInput">Secret Sync Code</label>
    <input type="password" id="syncCodeInput" placeholder="LK-XXX-XXX">
    
    <button id="saveBtn">Authenticate & Lock</button>
    <div id="status"></div>
    <script src="options.js"></script>
</body>
</html>
