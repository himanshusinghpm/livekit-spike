<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 250px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 15px;
            background-color: #0f172a; /* Dark slate background */
            color: #f8fafc;
            margin: 0;
        }
        h2 { margin-top: 0; font-size: 16px; color: #5eead4; border-bottom: 1px solid #334155; padding-bottom: 8px;}
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .label { color: #94a3b8; }
        .value { font-weight: bold; }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .status-tracking { background-color: #10b981; color: #022c22; }
        .status-idle { background-color: #64748b; color: #f8fafc; }
    </style>
</head>
<body>
    <h2>LiveKit Telemetry</h2>
    <div id="statusBadge" class="status-badge status-idle">IDLE</div>
    
    <div class="stat-row">
        <span class="label">Channel:</span>
        <span id="channelName" class="value">--</span>
    </div>
    <div class="stat-row">
        <span class="label">Current Peak:</span>
        <span id="currentPeak" class="value">--</span>
    </div>
    <div class="stat-row">
        <span class="label">Current Avg:</span>
        <span id="currentAvg" class="value">--</span>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
